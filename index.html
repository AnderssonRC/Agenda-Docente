<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html,body{margin:0;min-height:100%;}
  body{font-family:'Manrope',sans-serif;background:oklch(96% 0.012 75);}
  a{color:inherit;text-decoration:none;}
  input,select,textarea{font-family:'Manrope',sans-serif;}
  ::selection{background:oklch(70% 0.08 55 / 0.35);}

  /* Efectos al pasar el mouse. El color se pasa por variable en el style:
     <a class="h-c" style="color:…;--hc:colorHover">  */
  .h-c:hover{color:var(--hc)!important;}
  .h-bg:hover{background:var(--hbg)!important;}
  .h-b:hover{border-color:var(--hb)!important;}
  .h-u:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div id="app">
    <!-- Pantalla de carga: se ve al instante mientras arranca la app -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
      <img src="logo-192.png" alt="" style="width:64px;height:64px;border-radius:16px;opacity:.85;">
    </div>
  </div>
  <noscript><p style="text-align:center;font-family:sans-serif;">Agenda Docente necesita JavaScript activado.</p></noscript>
  <script type="module" src="app/main.js"></script>
</body>
</html>
